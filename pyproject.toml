[project]
name = "claude-sessions"
version = "0.1.0"
description = "Every Claude Code session running on this machine: where it is, what it's on and whether it needs you."
requires-python = ">=3.13"
dependencies = ["cli-kit"]

[project.scripts]
claude-sessions = "claude_sessions.__main__:main"

[tool.uv.sources]
cli-kit = { git = "https://github.com/ianflanagan1/cli-kit", tag = "v0.1.0" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "claude_sessions"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
